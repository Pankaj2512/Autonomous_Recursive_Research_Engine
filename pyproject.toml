[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-recursive-research-engine"
version = "0.1.0"
description = "Autonomous Recursive Research Engine (Prime Agent RLM) built with LangGraph and Model Context Protocol (MCP)"
readme = "README.md"
authors = [
    { name = "Pankaj Kumar" }
]
requires-python = ">=3.9"
dependencies = [
    "langgraph>=0.2.20",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "duckduckgo-search>=6.2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
]

[project.scripts]
research-engine = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
